name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest

  # The single file has to keep working, because it is how most people will
  # actually try this: copy one thing to a server and run it. Built and
  # exercised from a directory where the package is not installed, so a missing
  # data file or a stray absolute import fails here rather than on someone's
  # host.
  single-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Build
        run: python3 scripts/build_singlefile.py /tmp/agentwatchdog.pyz
      - name: Run it with nothing installed
        working-directory: /tmp
        run: |
          ./agentwatchdog.pyz version
          ./agentwatchdog.pyz agents
          ./agentwatchdog.pyz selftest
      - name: All built-in fingerprints must survive the packaging
        working-directory: /tmp
        run: |
          count=$(./agentwatchdog.pyz agents | head -1 | cut -d' ' -f1)
          test "$count" -ge 5 || { echo "only $count fingerprints in the archive"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: agentwatchdog-pyz
          path: /tmp/agentwatchdog.pyz

  # site/ is committed so Cloudflare Pages needs no build command and a deploy
  # cannot break. The cost of that is drift, so the build is re-run here and
  # the committed output has to match — otherwise the Chinese page quietly
  # falls a release behind the English one, which is the exact failure the
  # generator exists to prevent.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 web/build.py --check

  # The redaction and anonymization guarantees in SECURITY.md are the reason
  # anyone would trust this tool on a real host. Run them as their own job so a
  # failure is impossible to miss in the checks list.
  privacy-guarantees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Redaction and anonymized-export tests
        run: pytest tests/test_redact.py tests/test_export_anon.py -v
